<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Wet blood drop favicon</title>
  <desc id="desc">A compact red blood drop with a dark red semi-gradient fill and a tiny wet highlight.</desc>
  <defs>
    <linearGradient id="bloodGradient" x1="144" y1="64" x2="390" y2="456" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff4b4b"/>
      <stop offset="0.38" stop-color="#d31120"/>
      <stop offset="0.72" stop-color="#95000c"/>
      <stop offset="1" stop-color="#560006"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="35%" cy="28%" r="67%">
      <stop offset="0" stop-color="#ff8181" stop-opacity="0.34"/>
      <stop offset="0.45" stop-color="#e60012" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#470005" stop-opacity="0.24"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="145%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#300003" flood-opacity="0.32"/>
    </filter>
  </defs>

